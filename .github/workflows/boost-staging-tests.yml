name: PRIME BOOST staging verification
on:
  push:
    branches:
      - feature/prime-boost-staging
    paths:
      - 'server/boost-*.mjs'
      - 'tests/boost-*.mjs'
      - 'js/boost-*.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/boost-staging-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
