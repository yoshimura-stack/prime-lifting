name: Validate PRIME LIFTING
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Validate staging Worker configuration (dry run only)
        run: npm run check:staging
      - name: Upload BOOST review bundle (no deployment)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: prime-boost-review-${{ github.sha }}
          path: |
            public/
            server/
            wrangler.jsonc
            wrangler.staging.jsonc
            docs/prime-boost-staging-acceptance-20261028.md
            docs/prime-boost-production-rollout-rollback-20261027.md
            sql/prime-boost-daily-one-per-type-20261028.sql
            sql/prime-boost-submit-proposal-20261027.sql
          if-no-files-found: warn
          retention-days: 7
