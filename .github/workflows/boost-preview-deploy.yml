name: Deploy isolated PRIME BOOST preview
on:
  workflow_dispatch:
  push:
    branches:
      - feature/prime-boost-staging
    paths:
      - '.github/boost-preview-deploy-request.txt'
permissions:
  contents: read
concurrency:
  group: prime-boost-isolated-preview-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/feature/prime-boost-staging'
    runs-on: ubuntu-latest
    environment: boost-preview
    timeout-minutes: 15
    steps:
      - name: Check isolated staging target
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/feature/prime-boost-staging"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:boost-preview
      - name: Verify isolated Worker and explicit guarded API flags
        shell: bash
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const c=JSON.parse(fs.readFileSync("wrangler.boost-preview.jsonc","utf8"));
            if(c.name!=="prime-boost-isolated-preview" ||
               c.main!=="server/boost-preview-worker.mjs" ||
               c.vars?.BOOST_PREVIEW_ENABLED!=="true" ||
               c.vars?.BOOST_WELCOME_GRANT_ENABLED!=="true" ||
               c.vars?.BOOST_DAILY_LOGIN_GRANT_ENABLED!=="true" ||
               c.vars?.BOOST_PREVIEW_PROJECT_ID!=="tarnzjkxexlozqqmyqof" ||
               c.assets?.directory!=="./boost-preview-public") process.exit(1);
          '
      - name: Diagnose isolated Cloudflare credentials (no secret output)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BOOST_PREVIEW_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.BOOST_PREVIEW_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing isolated preview API token"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing isolated preview account ID"; exit 1; }
          token_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --max-time 15 --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "Cloudflare preview token verification HTTP: $token_status"
          test "$token_status" = "200" || { echo "::error::Preview token verification failed"; exit 1; }
          account_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --max-time 15 --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")
          echo "Cloudflare isolated account Workers API HTTP: $account_status"
          if [ "$account_status" != "200" ]; then
            echo "::warning::Preview token cannot list Workers in configured account; verify account ID and Workers Scripts Read/Edit scope."
          fi
      - name: Check staging run signing configuration (no secret output)
        shell: bash
        env:
          BOOST_RUN_SIGNING_SECRET: ${{ secrets.BOOST_RUN_SIGNING_SECRET }}
        run: |
          if [ "${#BOOST_RUN_SIGNING_SECRET}" -ge 32 ]; then
            echo "Staging run signing secret: configured"
          else
            echo "::notice::Staging run signing secret absent or too short; keep official run API disabled."
          fi
      - name: Deploy isolated preview only
        run: npx --yes wrangler@4.153.0 deploy --config wrangler.boost-preview.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BOOST_PREVIEW_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.BOOST_PREVIEW_CLOUDFLARE_ACCOUNT_ID }}
