name: PRIME BOOST staging tests
on:
  push:
    branches:
      - feature/prime-boost-staging
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci
      - name: Run complete regression suite
        run: npm test
      - name: Build preview assets without deploying
        run: npm run build
      - name: Validate isolated preview Worker without deploying
        run: npm run check:boost-preview
