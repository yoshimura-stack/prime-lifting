name: PRIME BOOST staging tests
on:
  push:
    branches:
      - feature/prime-boost-staging
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci
      - name: Run complete regression suite
        id: tests
        run: npm test
      - name: Build preview assets without deploying
        id: build
        run: npm run build
      - name: Validate isolated preview Worker without deploying
        id: preview
        run: npm run check:boost-preview
      - name: Record validation summary
        if: always()
        run: |
          echo '## PRIME BOOST isolated staging checks' >> "$GITHUB_STEP_SUMMARY"
          echo '- Workflow: test/build/dry-run only; no deployment.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Tests: ${{ steps.tests.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo '- Main build: ${{ steps.build.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo '- Preview dry-run: ${{ steps.preview.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production Worker, DB, and ranking are not changed by this workflow.' >> "$GITHUB_STEP_SUMMARY"
