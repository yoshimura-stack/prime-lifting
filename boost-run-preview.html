<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>PRIME BOOST | Signed Run API Staging</title>
<style>body{font:16px system-ui,sans-serif;background:#071526;color:#f4f7fc;margin:0;padding:24px}main{max-width:660px;margin:auto}section{padding:18px;border:1px solid #43647e;border-radius:12px;margin:16px 0}input,button{font:inherit;padding:12px;border-radius:7px}input{width:min(95%,480px)}button{margin:6px;background:#244968;color:white;border:1px solid #6999bb}button:disabled{opacity:.4}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head>
<body><main><h1>⚽ BOOST STAGING</h1><p>隔離環境の署名付きSTART / FINISH API疎通検証。実際のゲーム・ランキング本番には接続しません。</p>
<section><label for="token">検証用の短期Bearerトークン</label><p><input id="token" type="password" autocomplete="off" placeholder="トークンを入力"></p><button id="connect" type="button">接続を検証</button></section>
<section><h2>テスト用BOOST</h2><p id="inventory">未接続</p><div id="boost-options"></div><button id="start" type="button" disabled>署名付きプレイを開始</button><button id="finish" type="button" disabled>空入力の検証用プレイを終了</button><p>空入力の検証は0点として処理される可能性があります。ステージング専用テストアカウントを使用してください。</p></section>
<section><h2>検証ログ</h2><pre id="status" role="status" aria-live="polite">未接続</pre></section>
<script type="module" src="./js/boost-run-preview-client.mjs"></script></main></body></html>
