<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PRIME PINBALL</title><link rel="stylesheet" href="pinball.css?v=1"></head>
<body class="pinball-page">
<header class="pb-header"><button id="pb-back" aria-label="リフティングへ戻る">← 戻る</button><div><small>PRIME ARCADE / 01</small><h1>PRIME <em>PINBALL</em></h1></div><button id="pb-pause">一時停止</button><button id="pb-sound" aria-pressed="false">音 OFF</button></header>
<main class="pb-layout">
 <section class="pb-cabinet" aria-label="ピンボール台"><canvas id="pb-canvas" width="600" height="960" aria-label="青いバンパーと3つのターゲットがあるピンボール台"></canvas><div class="pb-score"><div><small>SCORE</small><strong id="pb-score">000000</strong></div><div><small>残りボール</small><strong id="pb-balls">● ● ●</strong></div></div><div id="pb-message" role="status">発射してスタート</div></section>
 <aside class="pb-console"><p class="pb-kicker">NEON MATCHDAY</p><h2>狙って、<br>弾いて、<br><em>つなげ。</em></h2><p class="pb-copy">3つのターゲットを灯して<br><b>PRIME COMBO +1,000</b></p><dl><div><dt>POP BUMPER</dt><dd>100</dd></div><div><dt>TARGET</dt><dd>200</dd></div><div><dt>SLINGSHOT</dt><dd>50</dd></div></dl><button id="pb-launch" class="pb-primary">発射 / SPACE</button><button id="pb-retry" hidden>もう一度プレイ</button><p class="pb-help">左：A / ←　右：D / →<br>タッチ：左右のFLIPボタン<br>発射後4秒はボールセーブ</p><p class="pb-note">3 BALLS · スコアは今回のプレイのみ<br>本編の得点・報酬には影響しません</p></aside>
</main>
<nav class="pb-touch" aria-label="ピンボール操作"><button id="pb-left">◀ FLIP</button><button id="pb-fire">発射</button><button id="pb-right">FLIP ▶</button></nav>
<script src="js/pinball-engine.js?v=1"></script><script src="js/pinball-game.js?v=1"></script></body></html>
