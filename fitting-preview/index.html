<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRIME / SECRET UNIFORMS 3D LAB</title><style>
*{box-sizing:border-box}body{margin:0;background:#09130f;color:#e9f4ed;font-family:Arial,'Noto Sans JP',sans-serif}header{padding:18px 22px;border-bottom:1px solid #31503d;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}h1{font-size:21px;margin:3px 0}small,.muted{color:#94a99c}.lime{color:#d6ff65}.wrap{display:grid;grid-template-columns:minmax(330px,1fr) minmax(310px,1fr);gap:16px;padding:16px;max-width:1500px;margin:auto}.panel{background:#11231a;border:1px solid #345343;border-radius:16px;padding:15px}.stage{height:410px;border-radius:12px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#31584a,#0b1b17 72%);position:relative}canvas{width:100%;height:100%;display:block}.stamp{position:absolute;left:14px;top:12px;color:#dfff7e;font-weight:bold;pointer-events:none}.title{font-size:20px;font-weight:900;margin:14px 0 5px}.badge{display:inline-block;border:1px solid #527755;border-radius:20px;padding:5px 10px;font-size:12px;color:#dfff7e}.score{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}input{background:#08170f;color:white;border:1px solid #6a936e;border-radius:8px;font-size:19px;font-weight:700;padding:9px;width:160px}button{cursor:pointer;border:1px solid #56715d;border-radius:10px;background:#20382b;color:white;padding:11px;font-weight:bold}button:hover{border-color:#d6ff65}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;max-height:560px;overflow:auto}.item{min-height:115px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:7px 3px}.item.locked{background:#14231b;color:#91a79b}.item.active{outline:2px solid #d6ff65;background:#28462b}.lock{font-size:29px;filter:grayscale(1)}.swatch{width:44px;height:45px;border-radius:10px 10px 7px 7px;clip-path:polygon(15% 0,35% 0,50% 12%,65% 0,85% 0,100% 27%,82% 39%,82% 100%,18% 100%,18% 39%,0 27%);border:2px solid #a6b8a4}.progress{height:12px;border-radius:8px;background:#2d4435;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#8cc949,#e4ff70);width:0}.notice{background:#263b2a;border:1px solid #7b9e58;padding:12px;border-radius:10px;margin-top:12px}.hint{font-size:12px;color:#a2b4a7;line-height:1.6}@media(max-width:830px){.wrap{grid-template-columns:1fr}.stage{height:350px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style></head><body><header><div><small class="lime">PRIME / LIFTING LAB</small><h1>SECRET UNIFORM COLLECTION <span class="lime">3D</span></h1><small>ログイン中の最高記録で解放 / 選択してゲームへ</small></div><span class="badge">V0.5.26 / FITTING ROOM</span></header><main class="wrap"><section class="panel"><div class="stage"><canvas id="view"></canvas><div class="stamp">3D FITTING ROOM</div></div><div class="title" id="name">STANDARD</div><div class="muted" id="detail">選択したユニフォームを3Dで試着</div><input id="score" type="hidden" value="0"><div id="next" class="lime" style="font-weight:bold;margin:10px 0"></div><div class="progress"><div id="bar"></div></div><div class="notice" id="notice">初期ユニフォームが使用可能です。</div><p class="hint">解放はログイン中の自己ベストに基づきます。ゲストは初期衣装のみ。未解放のデザインは非公開です。</p><button id="wear-now" style="width:100%;background:#dfff6a;color:#13221a;padding:14px;border:0;border-radius:8px;font-weight:bold;cursor:pointer">この衣装で決定 →</button></section><section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><b>COLLECTION <span id="count" class="lime">1 / 34</span></b><small>🔒 SECRET = 未解放</small></div><div id="items" class="grid"></div></section></main><script src="three.min.js"></script><script src="renderer3d.js"></script><script src="costumes3d.js"></script><script>
'use strict';
// 0, 3k..18k, 20k, 24k..96k, 100k = 34 outfits.
const milestones=[0,3000,6000,9000,12000,15000,18000,20000,...Array.from({length:25},(_,i)=>24000+i*3000),100000];
const solids=['#d9e0e5','#d3283e','#1564c4','#e9c837','#19865b','#8c4ac4','#161d28'];
const palettes=[['#1d55b5','#f8f8f8','#d52e35','stripe'],['#d82135','#111b35','#e7d5a4','stripe'],['#ffffff','#14274b','#d12835','band'],['#101010','#f2b947','#f2b947','stripe'],['#13a3aa','#ffffff','#073d54','band'],['#8c1f40','#f5d6a0','#111d35','stripe'],['#f5f1dd','#1a3b86','#d52038','band'],['#244eaa','#e5c34e','#ffffff','stripe'],['#e94d24','#101828','#e5b65a','band'],['#121a29','#d42b3d','#f4f0e5','stripe'],['#52a8e4','#ffffff','#172b49','band'],['#e7d541','#224fa8','#ffffff','stripe'],['#156943','#f7e7ac','#e2b851','band'],['#ffffff','#111111','#d2a44a','stripe'],['#a71f30','#f1c5a2','#1d3b73','band'],['#111b24','#d7a84e','#e4bd65','stripe'],['#364bb8','#f2f2f2','#e83754','stripe'],['#bf2036','#f3c44d','#141f38','band'],['#071f37','#31d5e0','#a3ecff','stripe'],['#f0f0f0','#7b1f42','#e8bc72','band'],['#1e2736','#a9b8c6','#e9eef6','stripe'],['#29213f','#d8a9ff','#f1d5ff','band'],['#1c1c1c','#d9ad55','#f3d580','stripe'],['#062a31','#43d7ac','#d4fff0','band'],['#17141e','#b57afa','#f3c6ff','stripe']];
const specialDesigns={
  40000:{name:'NEON PULSE',primary:'#12162d',secondary:'#04f7e2',accent:'#80fff1',pattern:'neon',tier:'SPECIAL',glow:0.34},
  42000:{name:'LEOPARD KING',primary:'#d6a552',secondary:'#2c1a10',accent:'#fff1b5',pattern:'leopard',tier:'WILD'},
  45000:{name:'STREET HOODIE',primary:'#4e6c75',secondary:'#e2f1ed',accent:'#b7f7ed',pattern:'hoodie',tier:'STREET'},
  48000:{name:'BLACK SUIT',primary:'#17191e',secondary:'#f6f5ed',accent:'#e73b44',pattern:'suit',tier:'FORMAL'},
  51000:{name:'TIGER STRIKE',primary:'#ed791d',secondary:'#211711',accent:'#ffe19c',pattern:'tiger',tier:'WILD'},
  54000:{name:'GALAXY',primary:'#25124c',secondary:'#f567ee',accent:'#57f4ff',pattern:'galaxy',tier:'COSMIC',glow:0.28},
  57000:{name:'GOLDEN TUXEDO',primary:'#181818',secondary:'#e6bd61',accent:'#fff1b7',pattern:'tuxedo',tier:'FORMAL',glow:0.16},
  60000:{name:'CYBER GRID',primary:'#071b25',secondary:'#29f6c3',accent:'#7bfff2',pattern:'grid',tier:'CYBER',glow:0.34},
  63000:{name:'ZEBRA RUSH',primary:'#f4f1e9',secondary:'#151515',accent:'#d9ff68',pattern:'zebra',tier:'WILD'},
  66000:{name:'ROYAL CAPE',primary:'#53166d',secondary:'#f3c950',accent:'#fce4a1',pattern:'royal',tier:'ROYAL',glow:0.17},
  69000:{name:'LAVA ARMOR',primary:'#231317',secondary:'#ff5127',accent:'#ffc04c',pattern:'lava',tier:'ELEMENTAL',glow:0.35},
  72000:{name:'DENIM STREET',primary:'#37628c',secondary:'#b2d4ed',accent:'#f1f5f7',pattern:'denim',tier:'STREET'},
  75000:{name:'DISCO FEVER',primary:'#3a124c',secondary:'#f7d146',accent:'#ff65c9',pattern:'disco',tier:'PARTY',glow:0.28},
  78000:{name:'ICE PHANTOM',primary:'#bce9f4',secondary:'#4ac9f1',accent:'#ffffff',pattern:'ice',tier:'ELEMENTAL',glow:0.28},
  81000:{name:'SAMURAI GOLD',primary:'#1b1a21',secondary:'#d6a23e',accent:'#fff1a9',pattern:'samurai',tier:'MYTHIC',glow:0.3},
  84000:{name:'DRAGON SCALE',primary:'#176047',secondary:'#9ef3a6',accent:'#f8d95a',pattern:'scale',tier:'MYTHIC',glow:0.26},
  87000:{name:'PHANTOM SUIT',primary:'#282339',secondary:'#c9a6f7',accent:'#f0d9ff',pattern:'suit',tier:'MYTHIC',glow:0.35},
  90000:{name:'PLASMA STORM',primary:'#101535',secondary:'#d36bff',accent:'#64f9ff',pattern:'plasma',tier:'MYTHIC',glow:0.48},
  93000:{name:'BLACK DIAMOND',primary:'#14171d',secondary:'#91a5c1',accent:'#e8f8ff',pattern:'diamond',tier:'MYTHIC',glow:0.42},
  96000:{name:'GOLD EMPEROR',primary:'#4b3211',secondary:'#ffe082',accent:'#fff4c7',pattern:'royal',tier:'MYTHIC',glow:0.45},
  100000:{name:'LEGEND',primary:'#f3e5ff',secondary:'#78ecff',accent:'#ffe26d',pattern:'legend',tier:'LEGEND',glow:0.72}
};
const kits=milestones.map((pts,i)=>{if(i<7)return {pts,name:['STANDARD','CRIMSON','OCEAN','SUNSHINE','FOREST','VIOLET','MIDNIGHT'][i],primary:solids[i],secondary:solids[i],accent:solids[i],pattern:'solid',tier:'SOLID'};const p=palettes[i-7]||['#f1e2ff','#d7b44d','#72e5ff','stripe'];return {pts,name:i===33?'LEGEND':`WORLD KIT ${String(i-6).padStart(2,'0')}`,primary:p[0],secondary:p[1],accent:p[2],pattern:p[3],tier:i===33?'LEGEND':i>=18?'PREMIUM':'WORLD KIT'};});
kits.forEach((k,i)=>{if(k.pts>=40000){const d=specialDesigns[k.pts];if(d)Object.assign(k,d);}});
const cv=document.getElementById('view'),renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(35,1,1,2000);camera.position.set(0,90,380);camera.lookAt(0,85,0);scene.add(new THREE.HemisphereLight(0xe8f7ff,0x3e513e,2.2));const light=new THREE.DirectionalLight(0xffffff,3.3);light.position.set(-100,260,220);scene.add(light);const back=new THREE.DirectionalLight(0x98dfff,1.5);back.position.set(120,140,-150);scene.add(back);
const modeler=Object.create(PrimeRenderer.prototype);modeler.T=THREE;modeler.renderer=renderer;modeler.sphereGeo=new THREE.SphereGeometry(1,24,16);modeler.cylinderGeo=new THREE.CylinderGeometry(1,1,1,16);modeler.boxGeo=new THREE.BoxGeometry(1,1,1);modeler.player=modeler.makePlayer();scene.add(modeler.player.group);
// The original game positions limbs every frame. The fitting room needs a static standing pose.
for(const leg of modeler.player.legs){const s=leg.s,knee=[s*13,43,0],ankle=[s*15,10,0];modeler.connect(leg.thigh,[s*12,68,0],knee,7.2);leg.knee.position.set(...knee);modeler.connect(leg.calf,knee,ankle,5.6);leg.ankle.position.set(...ankle);leg.shoe.position.set(ankle[0],ankle[1]-4,ankle[2]+3);}
for(const arm of modeler.player.arms){const s=arm.s,elbow=[s*32,99,0],hand=[s*37,79,7];modeler.connect(arm.upper,[s*21,117,0],elbow,7);modeler.connect(arm.fore,elbow,hand,4.8);arm.elbow.position.set(...elbow);arm.hand.position.set(...hand);}
const costumeLab=PrimeCostumes3D.createCostumes(THREE,modeler);
const floor=new THREE.Mesh(new THREE.CylinderGeometry(82,88,8,48),new THREE.MeshStandardMaterial({color:'#203e2d',metalness:.25,roughness:.6}));floor.position.y=-9;scene.add(floor);
let selected=0,score=0,lastUnlocked=0;const el=id=>document.getElementById(id);
function refresh(){score=Math.max(0,Math.floor(Number(el('score').value)||0));const available=kits.filter(k=>score>=k.pts).length;el('count').textContent=`${available} / ${kits.length}`;if(selected>=available)selected=available-1;const next=kits.find(k=>k.pts>score);el('next').textContent=next?`次のシークレット解放まで あと ${(next.pts-score).toLocaleString()} PTS ／ ${next.pts.toLocaleString()} PTSで解放`:'🎉 ALL UNLOCKED — 全34着コンプリート！';const prev=next?kits[kits.indexOf(next)-1].pts:100000;el('bar').style.width=(next?Math.max(0,Math.min(100,100*(score-prev)/(next.pts-prev))):100)+'%';if(available>lastUnlocked){el('notice').textContent=lastUnlocked?`🎉 NEW UNIFORM UNLOCKED! ${available-lastUnlocked}着の新しいユニフォームを解放！`:'初期ユニフォームが使用可能です。'}lastUnlocked=available;
const box=el('items');box.replaceChildren();kits.forEach((k,i)=>{const unlocked=score>=k.pts;const b=document.createElement('button');b.className='item '+(unlocked?'':'locked ')+(selected===i?'active':'');const icon=document.createElement('div');icon.className=unlocked?'swatch':'lock';if(unlocked){icon.style.background=k.pattern==='solid'?k.primary:k.pattern==='stripe'?`repeating-linear-gradient(90deg,${k.primary} 0 10px,${k.secondary} 10px 18px)`:`repeating-linear-gradient(135deg,${k.primary} 0 8px,${k.secondary} 8px 13px,${k.accent} 13px 16px)`;}else{icon.textContent='🔒';}b.append(icon);const label=document.createElement('small');label.textContent=unlocked?k.name:'SECRET';b.append(label);const threshold=document.createElement('small');threshold.textContent=k.pts===0?'FREE':`${k.pts.toLocaleString()} PTS`;b.append(threshold);if(unlocked){b.onclick=()=>{selected=i;refresh();parent.postMessage({type:'prime-kit-select',index:i},'*');};}else{b.disabled=true;b.title=`${k.pts.toLocaleString()} PTSで解放`;}box.append(b);});const k=kits[selected];modeler.setKit(k);costumeLab.dress(k);el('name').textContent=k.name;el('detail').textContent=`${k.tier} / ${k.pts.toLocaleString()} PTSで解放済み`;}
function animate(t){const rect=cv.getBoundingClientRect();const w=Math.max(1,Math.floor(rect.width)),h=Math.max(1,Math.floor(rect.height));if(cv.width!==Math.round(w*renderer.getPixelRatio())||cv.height!==Math.round(h*renderer.getPixelRatio())){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}modeler.player.group.rotation.y=Math.sin(t*.00055)*.38;modeler.player.group.position.y=Math.sin(t*.002)*1.5;renderer.render(scene,camera);requestAnimationFrame(animate)}refresh();requestAnimationFrame(animate);
window.addEventListener('message',e=>{if(e.source!==parent)return;const d=e.data||{};if(d.type==='prime-kit-best'){el('score').value=Math.max(0,Number(d.best)||0);if(Number.isInteger(d.selected)&&d.selected>=0&&d.selected<kits.length&&kits[d.selected].pts<=Number(el('score').value))selected=d.selected;refresh();}});
el('wear-now').onclick=()=>parent.postMessage({type:'prime-kit-confirm',index:selected},'*');
parent.postMessage({type:'prime-kit-ready'},'*');
</script></body></html>
