<!doctype html><html lang="ja"><meta charset="utf-8"><title>PRIME V0.2.1 / Pose check</title><style>body{margin:24px;background:#13221b;color:#eee;font:14px Arial}canvas{display:block;width:min(100%,1000px);margin-top:16px}button{padding:10px;margin:4px;background:#d8edaa;border:0;cursor:pointer}p{color:#bccab8}</style>
<h1>V0.2.1 / 描画検証</h1><p>選手の左右は選手本人から見た左右です。検証専用の静止ポーズで、実ゲームの自動操作ではありません。</p><div id="controls"></div><canvas id="scene" width="1000" height="620"></canvas><p id="result"></p>
<script src="../vendor/three.min.js"></script><script src="../js/config.js"></script><script src="../js/engine.js"></script><script src="../js/renderer3d.js"></script><script>
const g=new LiftingGame(PRIME_CONFIG),r=new PrimeRenderer(document.getElementById('scene'),PRIME_CONFIG);
function pose(name,side){g.reset();g.phase='playing';if(name==='JUMP_HEADER'){g.player.y-=55;}if(name==='SPIN'){g.player.spin=PRIME_CONFIG.SPIN_DURATION*.72;g.action='SPIN';g.ball.y=230;}else{const region=g.regions().find(p=>p.name===name&&p.side===side);Object.assign(g.ball,{x:region.x,y:region.y});g.act();}r.render(g);document.getElementById('result').textContent=(g.actionSide||'')+' '+g.action+' / score '+g.score;}
for(const [name,side]of [['FOOT','LEFT'],['FOOT','RIGHT'],['KNEE','LEFT'],['KNEE','RIGHT'],['CHEST',null],['HEADER',null],['JUMP_HEADER',null],['SPIN',null]]){const b=document.createElement('button');b.textContent=(side||'')+' '+name;b.onclick=()=>pose(name,side);document.getElementById('controls').append(b);}pose('FOOT','LEFT');
</script></html>
